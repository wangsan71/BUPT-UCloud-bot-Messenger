name = "bupt-ucloud-bot-messenger"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Create the D1 database once, then fill in database_id:
#   npx wrangler d1 create bupt-ucloud-bot
[[d1_databases]]
binding = "DB"
database_name = "bupt-ucloud-bot"
database_id = "6d175d96-3cd6-42d5-808d-7b73f17e4d50"
migrations_dir = "migrations"

[vars]
PUBLIC_BASE_URL = "https://playerrone.ccwu.cc"

# Primary Feishu-reachable paths on apex (Pages/edgetunnel keeps / and other paths)
# Path routes override Pages/edgetunnel catch-all for these prefixes.
[[routes]]
pattern = "playerrone.ccwu.cc/webhook/feishu"
zone_name = "playerrone.ccwu.cc"

[[routes]]
pattern = "playerrone.ccwu.cc/webhook/*"
zone_name = "playerrone.ccwu.cc"

[[routes]]
pattern = "playerrone.ccwu.cc/health"
zone_name = "playerrone.ccwu.cc"

[[routes]]
pattern = "playerrone.ccwu.cc/login"
zone_name = "playerrone.ccwu.cc"

[[routes]]
pattern = "playerrone.ccwu.cc/login*"
zone_name = "playerrone.ccwu.cc"

[[routes]]
pattern = "playerrone.ccwu.cc/api/login"
zone_name = "playerrone.ccwu.cc"

[[routes]]
pattern = "playerrone.ccwu.cc/api/*"
zone_name = "playerrone.ccwu.cc"

# Secondary custom domain (campus DNS may NXDOMAIN; keep as backup)
[[routes]]
pattern = "ucloud-bot.playerrone.ccwu.cc"
custom_domain = true

# Example cron for Phase 4 (todo diff / deadline reminders). Leave commented until ready.
# [triggers]
# crons = ["0 * * * *"]

# Secrets (set with `npx wrangler secret put <NAME>`, see docs/ENV.md):
# FEISHU_APP_ID, FEISHU_APP_SECRET, FEISHU_ENCRYPT_KEY, FEISHU_VERIFICATION_TOKEN
# LARK_APP_ID, LARK_APP_SECRET, LARK_ENCRYPT_KEY, LARK_VERIFICATION_TOKEN
# WECOM_CORP_ID, WECOM_AGENT_ID, WECOM_SECRET, WECOM_TOKEN, WECOM_ENCODING_AES_KEY
# SESSION_ENCRYPTION_KEY, BYRDOCS_OCR_TOKEN (optional captcha OCR)